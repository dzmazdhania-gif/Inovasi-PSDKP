name: Update Bali Coastal Business Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Bali coastal business data
        run: |
          python scripts/download_bali_coastal_businesses.py

      - name: Check generated file
        run: |
          ls -lh data/coastal_businesses.geojson

      - name: Commit updated GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/coastal_businesses.geojson

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Bali coastal business data"
            git push
          fi
